name: Claude Code

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  claude:
    # TRUST GATE — do not remove.
    #
    # This repository is public, and this job runs Claude with write access to
    # the repo plus the owner's CLAUDE_CODE_OAUTH_TOKEN. Without the author
    # check below, any stranger could trigger it by opening an issue or
    # commenting "@claude", spending the owner's Claude quota and steering an
    # agent that can push branches and open pull requests.
    #
    # Only the repo owner, org members, and invited collaborators can start it.
    # Note that `pull_request` (as opposed to `pull_request_target`) already
    # withholds secrets from fork PRs; the association check is what closes the
    # issue and comment paths.
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.sender.author_association) &&
      (
        (github.event_name == 'issues' && github.event.action == 'opened') ||
        (github.event_name == 'pull_request') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model claude-sonnet-4-6 --max-turns 10"

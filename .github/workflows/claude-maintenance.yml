name: Claude Maintenance

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model claude-sonnet-4-6 --max-turns 10"
          prompt: |
            Review this repo for maintenance tasks:
            1. Check for outdated dependencies
            2. Run tests and report failures
            3. Scan for TODO/FIXME comments
            4. Check for stale issues
            Open an issue summarizing findings.

# Alembic configuration for Fade-Out.
#
# The database URL is NOT set here on purpose -- env.py pulls it from the
# application settings (app.config.settings.DATABASE_URL, i.e. the same
# DATABASE_URL env var the app uses) so migrations always target the same DB as
# the running service. Override for a one-off run with:
#   alembic -x db_url=sqlite+aiosqlite:///./local.db upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
